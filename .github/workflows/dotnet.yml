# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "init-commit" ]
  pull_request:
    branches: [ "init-commit" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Install WebAssembly tools
      run: dotnet workload install wasm-tools
    - name: Restore dependencies
      run: |
        dotnet restore CsvObfuscator/CsvObfuscator.csproj
        dotnet restore CsvObfuscator.Desktop/CsvObfuscator.Desktop.csproj
        dotnet restore CsvObfuscator.Browser/CsvObfuscator.Browser.csproj
    - name: Build Desktop
      run: dotnet build CsvObfuscator.Desktop/CsvObfuscator.Desktop.csproj --no-restore
    - name: Build Browser
      run: dotnet build CsvObfuscator.Browser/CsvObfuscator.Browser.csproj --no-restore
    - name: Test
      run: dotnet test CsvObfuscator/CsvObfuscator.csproj --no-build --verbosity normal
