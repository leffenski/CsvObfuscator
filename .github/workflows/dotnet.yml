# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "init-commit" ]
  pull_request:
    branches: [ "init-commit" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore --project CsvObfuscator/CsvObfuscator.csproj
    - name: Build
      run: dotnet build --no-restore --project CsvObfuscator.Desktop/CsvObfuscator.Desktop.csproj --project CsvObfuscator.Browser/CsvObfuscator.Browser.csproj
    - name: Test
      run: dotnet test --no-build --verbosity normal --project CsvObfuscator/CsvObfuscator.csproj
