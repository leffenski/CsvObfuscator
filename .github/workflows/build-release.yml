name: Build Release

on:
  release:
    types: [created]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: CsvObfuscator
            asset_name: CsvObfuscator-linux-x64
          - os: windows-latest
            rid: win-x64
            artifact_name: CsvObfuscator.exe
            asset_name: CsvObfuscator-win-x64.exe
          # - os: macos-latest
          #   rid: osx-x64
          #   artifact_name: CsvObfuscator
          #   asset_name: CsvObfuscator-osx-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Debug
        run: dotnet publish CsvObfuscator/CsvObfuscator.csproj -c Debug -r ${{ matrix.rid }} --self-contained -o ./publish

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./publish/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          asset_content_type: application/octet-stream
